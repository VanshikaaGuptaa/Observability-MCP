# HTTP: allow ACME challenges and redirect everything else to HTTPS
server {
    listen 80;
    server_name 34.69.34.84;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://34.69.34.84$request_uri;
    }
}

# HTTPS frontend and API reverse proxy
server {
    listen 443 ssl;
    server_name 34.69.34.84;

    ssl_certificate /etc/letsencrypt/live/34.69.34.84/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34.69.34.84/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Certbot HTTP-01 challenge files
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Failure scenario control -> Orderflow
    location = /api/failure-scenario {
        proxy_pass http://orderflow:8080/api/admin/failure-scenario;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Orders -> Orderflow
    location /api/orders {
        proxy_pass http://orderflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Other agent APIs -> Signal Agent
    location /api/ {
        proxy_pass http://signal-agent:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
