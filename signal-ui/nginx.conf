
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Failure scenario control -> Orderflow
    location = /api/failure-scenario {
        proxy_pass http://orderflow:8080/api/admin/failure-scenario;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Orders -> Orderflow
    location /api/orders {
        proxy_pass http://orderflow:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Agent APIs -> Signal Agent
    location /api/ {
        proxy_pass http://signal-agent:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
