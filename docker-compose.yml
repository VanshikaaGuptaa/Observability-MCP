services:

  orderflow:
    build:
      context: ./orderflow
      dockerfile: Dockerfile

    container_name: orderflow

    env_file:
      - .env

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://${ORDERFLOW_HOST}:${APP_PORT}/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

    networks:
      - observability-network


  postgres:
    image: postgres:16

    container_name: orderflow-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./orderflow/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - observability-network


  redis:
    image: redis:7

    container_name: orderflow-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    networks:
      - observability-network

  
  
  signal-agent:
    build:
      context: .
      dockerfile: ./signal-agent/dockerfile
    container_name: signal-agent
    env_file:
      - .env
    environment:
      AGENT_PORT: "8090"
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SETTINGS_ALLOW_REMOTE: "true"
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      ORDERFLOW_URL: http://orderflow:8080
      MCP_WORKING_DIR: /app/observability-mcp
      MCP_COMMAND: go
    depends_on:
      orderflow:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    ports:
      - "8090:8090"
    volumes:
      - ./signal-agent/knowledge.json:/app/signal-agent/knowledge.json
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:8090/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - observability-network

  signal-ui:
    build:
      context: ./signal-ui
      dockerfile: dockerfile
    container_name: signal-ui
    ports:
      - "80:80"
    depends_on:
      signal-agent:
        condition: service_healthy
      orderflow:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - observability-network

  prometheus:
    image: prom/prometheus:latest

    container_name: orderflow-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - ./prometheus/rules:/etc/prometheus/rules:ro

    depends_on:
      - orderflow
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://${PROMETHEUS_HOST}:${PROMETHEUS_PORT}/-/healthy"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - observability-network

  loki:
    image: grafana/loki:3.7.0
    container_name: orderflow-loki

    command:
      - "-config.file=/etc/loki/loki-config.yml"

    ports:
      - "3100:3100"

    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

    restart: unless-stopped

    networks:
      - observability-network

  alloy:
    image: grafana/alloy:latest
    container_name: orderflow-alloy

    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=0.0.0.0:12345"

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - loki

    restart: unless-stopped

    ports:
      - "12345:12345"

    networks:
      - observability-network

volumes:

  postgres_data:

  redis_data:

  prometheus_data:

  loki_data:


networks:

  observability-network:
    driver: bridge